name: classcheck
description: "ClassCheck — gestion des absences par QR code dynamique et vérification faciale."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # État et navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2

  # Caméra, visage, QR
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.12.1
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  # Décodage / recadrage du selfie avant le modèle TFLite (ajout signalé dans le README)
  image: ^4.2.0

  # Interface
  google_fonts: ^6.2.1
  intl: ">=0.19.0 <0.21.0"
  pdf: ^3.13.1
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
